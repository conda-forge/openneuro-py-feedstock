{% set python_min = "3.10" %}
{% set name = "openneuro-py" %}
{% set version = "2026.9.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: a919ad7e4ef46845b1638db06a4c6d3e1cdbe87c84e4f2d47a154884b9eaeb00

build:
  entry_points:
    - openneuro-py = openneuro._cli:app
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatch-vcs
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - aiofiles
    - niquests >=3.7.2
    - platformdirs
    - pydantic >=2
    - rich >=13.8
    - typer >=0.24.0
    - wcmatch >=10.1

test:
  imports:
    - openneuro
  commands:
    - pip check
     # Test the entry point.
    - openneuro-py --version
    - openneuro-py --help
    - openneuro-py download --help
    - openneuro-py download --dataset=ds000248 --include=CHANGES --no-verify-size
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/openneuro-py/
  summary: A Python client for OpenNeuro.
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - larsoner
    - hoechenberger
